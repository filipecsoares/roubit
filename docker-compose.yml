services:
  postgres:
    image: postgres:16-alpine
    container_name: roubit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roubit
      POSTGRES_USER: roubit_user
      POSTGRES_PASSWORD: roubit_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roubit_user -d roubit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roubit-redis
    restart: unless-stopped
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: roubit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://roubit_user:roubit_secure_password@postgres:5432/roubit
      REDIS_URL: redis://redis:6379
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      JWT_SECRET: production_super_secret_jwt_key_at_least_32_chars!
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roubit-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
