[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Roubit Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/filipecsoares/roubit"

[workspace.dependencies]
# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "~1.11", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
envy = "0.4"
clap = { version = "~4.5.30", features = ["derive", "env", "cargo"] }
comfy-table = "7.1"
colored = "2.2"
indicatif = "0.17"
rpassword = "7.3"
tempfile = "3.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Cryptography & Memory Security
aes-gcm = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
hex-literal = "0.4"

# Benchmarking & Testing
criterion = { version = "0.5", features = ["html_reports"] }

# Database & Persistence
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate", "macros"] }

# Async & Runtime
tokio = { version = "1.43", features = ["full"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Internal workspace crates
roubit-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
