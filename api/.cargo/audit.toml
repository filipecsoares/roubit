# Configuration for cargo-audit (RustSec)
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack timing side-channel in rsa crate (v0.9.10).
    # Transitively pulled in by sqlx-mysql metadata. Roubit uses SQLite exclusively
    # and does not compile or use RSA. No upstream patch is currently available.
    "RUSTSEC-2023-0071",
]
